allowBuilds:
  "@apollo/protobufjs": true
  "@datadog/pprof": true
  "@parcel/watcher": true
  "@reown/appkit": true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  utf-8-validate: true
overrides:
  "@tanstack/react-router": "1.170.41"
  date-fns: "4.3.0"
  vite: "8.0.14"
  rolldown: "1.0.2"
# pnpm scripts never reinstall: an install made with POWERHOUSE_DIR (see
# .pnpmfile.cjs) stays in place until the next explicit `pnpm install`.
verifyDepsBeforeRun: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@powerhousedao/*"
  - "@renown/*"
  - document-model

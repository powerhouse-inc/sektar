# Test branch only (prerelease branch `vetra-next`): runs powerhouse-inc/vetra-publish@v1
# as Vetra's generated workflow does. No tag trigger and no desktop workflow here, so the
# v* tag the release cuts on this branch starts nothing; main keeps Sektar's real workflows.
name: Vetra
on:
  push:
    branches: [vetra-next]
permissions: {}
concurrency:
  group: vetra-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 12.10.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: powerhouse-inc/vetra-publish@v1
        with:
          app-id: 43622402-be06-435a-bbfa-bb649b0d6244

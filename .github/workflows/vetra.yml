name: Vetra
on:
  push:
    branches: ['**', '!release-please--**']
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  # Per commit for pushes: a newer push never cancels a run that is cutting a release.
  group: vetra-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publish:
    # Skip pull requests opened from another repository: they must not reach the
    # OIDC token. Compare full names rather than asking whether the head repo is
    # a fork, which is true for every PR when this repository is itself a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 12.10.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: powerhouse-inc/vetra-publish@v1
        with:
          app-id: 43622402-be06-435a-bbfa-bb649b0d6244

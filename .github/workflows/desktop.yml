name: Desktop
# The Sektar desktop app (hosts/desktop: switchboard + Connect in a Tauri
# window) for macOS (Apple Silicon), Windows and Linux. A v* tag gets a release
# once all three have built and started.
# Signed ad hoc, by no developer: macOS asks the user to confirm the first
# launch (Privacy & Security, Open Anyway), and Windows' SmartScreen asks too.
on:
  push:
    tags: ["v*"]
  # A change to the desktop host or this workflow proves the build before a tag.
  pull_request:
    paths:
      - "hosts/desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/desktop-secrets.mjs"
      - "qa/desktop/smoke.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      FEATURE_UNIFORM_RUNNERS_ENABLED: "1"
      # linuxdeploy (the AppImage bundler) is itself an AppImage: runners have
      # no FUSE to mount it, so it extracts itself instead; its bundled strip
      # also fails on current system libraries.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.10.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file xvfb
      - run: pnpm install --frozen-lockfile
      - name: The Google desktop client and the AI demo key this build ships
        run: node .github/scripts/desktop-secrets.mjs
        env:
          GOOGLE_DESKTOP_OAUTH_CLIENT: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT }}
          OPENROUTER_DEMO_KEY: ${{ secrets.OPENROUTER_DEMO_KEY }}
      - run: pnpm exec ph-cli run desktop build
        # Linux bundles the .deb before the AppImage; an AppImage failure
        # (linuxdeploy on a runner) must not cost the .deb, checked below.
        continue-on-error: ${{ runner.os == 'Linux' }}
      - name: Linux installer present
        if: runner.os == 'Linux'
        run: ls hosts/desktop/*/target/release/bundle/deb/*.deb

      # Tauri always writes a zlib (UDZO) disk image; LZMA (ULMO) makes the
      # download about a fifth smaller and opens on the macOS Sektar needs.
      - name: Compress the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          for dmg in hosts/desktop/tauri-shell/target/release/bundle/dmg/*.dmg; do
            hdiutil convert "$dmg" -format ULMO -o "$dmg.ulmo.dmg"
            mv -f "$dmg.ulmo.dmg" "$dmg"
            hdiutil verify "$dmg"
            ls -l "$dmg"
          done

      # The app as it ships starts with no environment, and its stack runs:
      # on macOS, the copy inside the disk image people download, dragged out
      # as Finder would.
      - name: The app starts (macOS, from the disk image)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls hosts/desktop/tauri-shell/target/release/bundle/dmg/*.dmg | head -1)
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          ditto "$mnt/Sektar.app" "$RUNNER_TEMP/Applications/Sektar.app"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/Applications/Sektar.app"
          # The minimum macOS is the one the bundled Node needs.
          node_min=$(otool -l "$app/Contents/MacOS/node" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          plist_min=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          echo "LSMinimumSystemVersion $plist_min, bundled Node needs $node_min"
          [ "$(printf '%s\n%s\n' "$node_min" "$plist_min" | sort -V | tail -1)" = "$plist_min" ]
          node qa/desktop/smoke.mjs --app "$app/Contents/MacOS/sektar" \
            --node "$app/Contents/MacOS/node" --stack "$app/Contents/Resources/stack"
          # After the run: a file the stack wrote into the bundle breaks this too.
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: The app starts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out=hosts/desktop/tauri-shell/target/release
          node qa/desktop/smoke.mjs --app "$out/sektar.exe" --node "$out/node.exe" --stack "$out/stack"
      - name: The app starts (Linux, from the .deb)
        if: runner.os == 'Linux'
        run: |
          root="$RUNNER_TEMP/deb"
          dpkg-deb -x hosts/desktop/tauri-shell/target/release/bundle/deb/*.deb "$root"
          stack=$(find "$root/usr/lib" -maxdepth 2 -type d -name stack | head -1)
          xvfb-run -a node qa/desktop/smoke.mjs --app "$root/usr/bin/sektar" \
            --node "$root/usr/bin/node" --stack "$stack"

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: sektar-desktop-${{ matrix.os }}
          path: |
            hosts/desktop/**/release/bundle/dmg/*.dmg
            hosts/desktop/**/release/bundle/nsis/*.exe
            hosts/desktop/**/release/bundle/deb/*.deb
            hosts/desktop/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # Only once every platform has built and started: a release that lacks one
  # says nothing about why.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sektar-desktop-*
          path: installers
          merge-multiple: true
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.deb
            installers/**/*.AppImage

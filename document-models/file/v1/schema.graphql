type FileState {
  title: String
  description: String
  "The source of truth: a stored file, or another document. Null until set."
  source: FileSource
  "Content extracted from or rendered for the source: text, html, pdf, images"
  renditions: [FileRendition!]!
  tags: [FileTag!]!
  "A change a folder sync found on disk that is not pulled yet. Null when there is none."
  placeholder: FilePlaceholder
}

enum FileSourceKind {
  ATTACHMENT
  DOCUMENT
  "A file found on disk whose bytes are not pulled yet"
  FILE_PLACEHOLDER
  "A document (.phd) found on disk that is not imported yet"
  DOCUMENT_PLACEHOLDER
}

type FileSource {
  kind: FileSourceKind!
  "ATTACHMENT: the stored bytes and what they are"
  ref: AttachmentRef
  fileName: String
  mimeType: String
  sizeBytes: Int
  "DOCUMENT: the document this file stands for, its type and a cached name"
  documentId: PHID
  documentType: String
  documentName: String
  setAt: DateTime!
}

type FileRendition {
  id: OID!
  "Any MIME type: text/plain, text/html, application/pdf, image/png"
  mimeType: String!
  "A free-form role, e.g. preview, ocr, pdf-export, thumbnail"
  type: String
  label: String
  "Stored content"
  ref: AttachmentRef
  fileName: String
  sizeBytes: Int
  "Or inline text content"
  text: String
  createdAt: DateTime!
}

type FileTag {
  id: OID!
  label: String!
  "A colour name from the design system: forest, sage, mint, clay, amber, info, neutral"
  color: String!
}

enum FilePlaceholderChange {
  CREATE
  UPDATE
  DELETE
}

enum FilePlaceholderTarget {
  FILE
  DOCUMENT
}

"A change found on disk by a folder sync, waiting to be pulled"
type FilePlaceholder {
  change: FilePlaceholderChange!
  target: FilePlaceholderTarget!
  "The folder sync that found it"
  mappingId: PHID!
  "Where it is below the mapping's local folder"
  relativePath: String!
  fileName: String!
  mimeType: String
  sizeBytes: Int
  "SHA-256 hex of the content on disk; null when it was deleted"
  hash: String
  modifiedAt: DateTime
  "DOCUMENT: what the .phd holds"
  documentId: PHID
  documentType: String
  documentName: String
  foundAt: DateTime!
}

# content

input SetTitleInput {
  title: String
}

input SetDescriptionInput {
  description: String
}

input SetAttachmentSourceInput {
  ref: AttachmentRef!
  fileName: String!
  mimeType: String
  sizeBytes: Int
  setAt: DateTime!
}

input SetDocumentSourceInput {
  documentId: PHID!
  documentType: String!
  documentName: String
  setAt: DateTime!
}

input ClearSourceInput {
  _: Boolean
}

# renditions

input AddRenditionInput {
  id: OID!
  mimeType: String!
  type: String
  label: String
  ref: AttachmentRef
  fileName: String
  sizeBytes: Int
  text: String
  createdAt: DateTime!
}

input UpdateRenditionInput {
  id: OID!
  mimeType: String
  type: String
  label: String
}

input RemoveRenditionInput {
  id: OID!
}

# tags

input AddTagInput {
  id: OID!
  label: String!
  color: String!
}

input UpdateTagInput {
  id: OID!
  label: String
  color: String
}

input RemoveTagInput {
  id: OID!
}

# disk

input SetPlaceholderInput {
  change: FilePlaceholderChange!
  target: FilePlaceholderTarget!
  mappingId: PHID!
  relativePath: String!
  fileName: String!
  mimeType: String
  sizeBytes: Int
  hash: String
  modifiedAt: DateTime
  documentId: PHID
  documentType: String
  documentName: String
  foundAt: DateTime!
}

input ClearPlaceholderInput {
  _: Boolean
}

input ApplyDiskVersionInput {
  ref: AttachmentRef!
  fileName: String!
  mimeType: String
  sizeBytes: Int
  setAt: DateTime!
  "The id the replaced source gets in the renditions, as the previous version"
  previousId: OID!
}
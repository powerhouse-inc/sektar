type InvoiceState {
  "BT-3: an invoice (380) or a credit note (381)"
  kind: InvoiceKind!
  direction: InvoiceDirection!
  status: InvoiceStatus!
  "BT-1"
  number: String
  "What the invoice is for, e.g. Powerhouse expenses, January 2026"
  subject: String
  "BT-2"
  issuedAt: DateTime
  "BT-9"
  dueAt: DateTime
  "BT-72"
  deliveredAt: DateTime
  "BG-14"
  period: InvoicePeriod
  "BT-5"
  currency: String!
  "BT-6: the currency VAT is accounted in, when it is not the invoice currency"
  vatCurrency: String
  "1 base = rate quote. Converts forward-billed costs and the VAT total (BT-111)."
  exchangeRates: [ExchangeRate!]!
  "BG-4"
  seller: InvoiceParty!
  "BG-7"
  buyer: InvoiceParty!
  references: InvoiceReferences!
  "BG-3: the invoices a credit note corrects"
  precedingInvoices: [PrecedingInvoice!]!
  "BG-25"
  lines: [InvoiceLine!]!
  "BT-120/121 per VAT category (BG-23)"
  vatReasons: [VatReason!]!
  "BG-16"
  paymentInstructions: PaymentInstructions!
  "BT-20"
  paymentTerms: String
  "BT-114"
  roundingAmount: Float
  "BT-22"
  notes: String
  "BG-24: documents at invoice level"
  attachments: [InvoiceAttachment!]!
  payments: [Payment!]!
  voidReason: String
}

enum InvoiceKind {
  INVOICE
  CREDIT_NOTE
}

enum InvoiceDirection {
  OUTGOING
  INCOMING
}

enum InvoiceStatus {
  DRAFT
  OPEN
  PAID
  VOID
}

type InvoicePeriod {
  start: DateTime
  end: DateTime
}

type ExchangeRate {
  base: String!
  quote: String!
  rate: Float!
  "The day the rate applies to"
  date: DateTime
  "Where the rate comes from, e.g. ECB, a bank statement"
  source: String
}

type InvoiceParty {
  "BT-27 / BT-44"
  name: String
  contactId: PHID
  "BT-31 / BT-48, with the country prefix"
  vatId: String
  "BT-30 / BT-47"
  registrationId: String
  "ISO 6523 ICD scheme of the registration id, e.g. 0208 (BE), 0184 (DK), 0183 (CH)"
  registrationScheme: String
  "BT-34 / BT-49: the Peppol address"
  endpointId: String
  endpointScheme: String
  email: String
  phone: String
  street: String
  additionalStreet: String
  postalCode: String
  city: String
  region: String
  "ISO 3166-1 alpha-2"
  country: String
}

type InvoiceReferences {
  "BT-10"
  buyerReference: String
  "BT-13"
  orderReference: String
  "BT-12"
  contractReference: String
  "BT-11"
  projectReference: String
}

type PrecedingInvoice {
  id: OID!
  "BT-25"
  number: String!
  "BT-26"
  issuedAt: DateTime
  "The corrected invoice, when it is a document here"
  documentId: PHID
}

enum VatCategory {
  "S"
  STANDARD
  "Z"
  ZERO_RATED
  "E"
  EXEMPT
  "AE"
  REVERSE_CHARGE
  "K"
  INTRA_COMMUNITY
  "G"
  EXPORT
  "O"
  OUTSIDE_SCOPE
}

type InvoiceLine {
  id: OID!
  "BT-153"
  description: String!
  "BT-127"
  note: String
  "BT-129: negative for a deduction"
  quantity: Float!
  "BT-130: UN/ECE Rec 20, e.g. C62 (unit), HUR (hour), DAY"
  unitCode: String!
  "BT-146, in the invoice currency; never negative"
  unitPrice: Float!
  "BT-151"
  vatCategory: VatCategory!
  "BT-152, percent"
  vatRate: Float!
  "BT-133: the buyer's accounting reference, e.g. Software, Travel"
  category: String
  "BG-26"
  period: InvoicePeriod
  "A forward-billed cost: what it cost, in its own currency"
  original: OriginalAmount
  "Receipts and other evidence for this line"
  attachments: [InvoiceAttachment!]!
}

type OriginalAmount {
  amount: Float!
  currency: String!
  "1 original currency = rate invoice currency; null uses the invoice's exchange rates"
  rate: Float
  "The supplier's invoice or receipt number"
  reference: String
}

type VatReason {
  category: VatCategory!
  "BT-121: a VATEX code, e.g. VATEX-EU-AE"
  code: String
  "BT-120: the legal mention as printed"
  text: String
}

type PaymentInstructions {
  "BT-81: UNCL 4461, e.g. 30 or 58 (credit transfer), 48 (card), ZZZ (mutually defined)"
  meansCode: String
  "BT-82"
  meansText: String
  "BT-84: an IBAN, or another account such as a wallet address"
  account: String
  "BT-85"
  accountName: String
  "BT-86"
  bic: String
  "BT-83"
  remittance: String
}

enum AttachmentRole {
  "The invoice as issued, e.g. the PDF that was sent"
  ISSUED_COPY
  "The editable original, e.g. the .docx"
  SOURCE
  SUPPORTING
  RECEIPT
  TIMESHEET
  OTHER
}

type InvoiceAttachment {
  id: OID!
  role: AttachmentRole!
  fileName: String!
  mimeType: String!
  "Stored bytes"
  ref: AttachmentRef
  sizeBytes: Int
  "BT-123"
  description: String
  "BT-124: an external location"
  url: URL
  "A document here that holds it, e.g. a File in the Files drive"
  documentId: PHID
  addedAt: DateTime!
}

enum PaymentMethod {
  BANK_TRANSFER
  CARD
  CASH
  OTHER
}

type Payment {
  id: OID!
  paidAt: DateTime!
  amount: Float!
  method: PaymentMethod!
  transactionId: String
}


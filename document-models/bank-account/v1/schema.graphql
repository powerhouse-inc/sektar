type BankAccountState {
  name: String
  institution: String
  iban: String
  kind: AccountKind!
  currency: String!
  openingBalance: Float!
  transactions: [Transaction!]!
  lastImportedAt: DateTime
}

type Transaction {
  id: OID!
  bookedAt: DateTime!
  amount: Float!
  counterparty: String!
  description: String
  reference: String
  category: TransactionCategory!
  contactId: String
  matchedDocumentId: String
  matchedKind: MatchKind
  status: TransactionStatus!
  importBatch: String
}

enum AccountKind {
  CURRENT
  SAVINGS
  CREDIT_CARD
}

enum MatchKind {
  INVOICE
  EXPENSE
}

enum TransactionStatus {
  "Reported by the bank, not booked yet: shown, not counted, not reviewed; the booked entry replaces it"
  PENDING
  NEW
  CATEGORIZED
  MATCHED
  EXCLUDED
}

enum TransactionCategory {
  UNCATEGORIZED
  SALES
  SUPPLIES
  PAYROLL
  RENT
  SOFTWARE
  TRAVEL
  MARKETING
  TAX
  BANK_FEES
  TRANSFER
  OTHER
}

# account

input SetAccountDetailsInput {
  name: String
  institution: String
  iban: String
  kind: AccountKind
  currency: String
  openingBalance: Float
}

# feed

input ImportTransactionsInput {
  batchId: String!
  importedAt: DateTime!
  transactions: [ImportedTransactionInput!]!
}

input ImportedTransactionInput {
  id: OID!
  bookedAt: DateTime!
  amount: Float!
  counterparty: String!
  description: String
  reference: String
  "True: the bank has not booked it yet (status PENDING)"
  pending: Boolean
}

input CategorizeTransactionInput {
  id: OID!
  category: TransactionCategory!
  contactId: String
}

input MatchTransactionInput {
  id: OID!
  documentId: String!
  kind: MatchKind!
}

input UnmatchTransactionInput {
  id: OID!
}

input ExcludeTransactionInput {
  id: OID!
  excluded: Boolean!
}

input RemovePendingTransactionsInput {
  ids: [OID!]!
}
